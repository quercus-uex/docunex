services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: docunex
      POSTGRES_PASSWORD: docunex
      POSTGRES_DB: docunex
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docunex -d docunex']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
