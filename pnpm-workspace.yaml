packages:
  - apps/*
  - packages/*
# argon2 incluye binarios precompilados; no necesita ejecutar su script de instalación.
allowBuilds:
  argon2: false
  # tsx (vista previa de las plantillas) funciona sin el script de instalación de esbuild.
  esbuild: false
minimumReleaseAgeExclude:
  - '@nestjs/cli@12.0.8'
  - '@nestjs/common@12.1.1'
  - '@nestjs/core@12.1.1'
  - '@nestjs/platform-express@12.1.1'
  - '@nestjs/testing@12.1.1'
  - '@nestjs/typeorm@12.0.2'
